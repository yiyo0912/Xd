<script>
    // Lógica robusta y local para gestionar archivos
    window.subirArchivo = (input, categoria) => {
      const files = Array.from(input.files);
      if (files.length === 0) return;

      const loader = document.getElementById(`load-${categoria}`);
      const listContainer = document.getElementById(`list-${categoria}`);
      
      // Validación de seguridad por si algún ID no coincide
      if (!loader || !listContainer) {
        console.error(`Error: No se encontraron los elementos HTML para la categoría: ${categoria}`);
        return;
      }

      // Activar animación de carga
      loader.style.display = "block";

      setTimeout(() => {
        try {
          // Remover el aviso de "Sin archivos" si está presente
          const placeholder = listContainer.querySelector('p');
          if (placeholder) {
            listContainer.innerHTML = '';
          }

          // Procesar cada archivo seleccionado
          files.forEach(file => {
            const url = URL.createObjectURL(file);
            const item = document.createElement('div');
            item.className = 'file-item';
            item.innerHTML = `
              <a href="${url}" target="_blank" class="file-link" title="Abrir archivo original">
                📄 ${file.name}
              </a>
              <button class="delete-btn" onclick="eliminarArchivo(this, '${categoria}', '${url}')" title="Eliminar archivo">✕</button>
            `;
            listContainer.appendChild(item);
          });

        } catch (error) {
          // Si algo falla, lo reporta en la consola para saber qué pasó
          console.error("Error procesando los archivos locales:", error);
        } finally {
          // Esto se ejecuta SIEMPRE, garantizando que el "Cargando..." se quite
          loader.style.display = "none";
          input.value = ""; // Limpiar el input para permitir volver a subir el mismo archivo
        }
      }, 400); // 400 milisegundos de efecto visual
    };

    window.eliminarArchivo = (btn, categoria, url) => {
      try {
        // Liberar la memoria del navegador
        URL.revokeObjectURL(url);
        
        const item = btn.closest('.file-item');
        if (item) item.remove();

        // Si la lista se queda vacía, regresar el mensaje original
        const listContainer = document.getElementById(`list-${categoria}`);
        if (listContainer && listContainer.children.length === 0) {
          listContainer.innerHTML = `
            <p style="color:rgba(255,255,255,.35); font-family:Inter,sans-serif; font-size:.82rem; text-align:center; padding:18px;">Sin archivos disponibles</p>
          `;
        }
      } catch (error) {
        console.error("Error al eliminar el archivo:", error);
      }
    };
  </script>
